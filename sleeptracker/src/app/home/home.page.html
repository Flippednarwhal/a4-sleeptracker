<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

    <ion-list>
      @for (sleep of allSleepData; track sleep){
      <ion-item>
        <ion-label>{{sleep.dateString()}} | {{sleep.summaryString()}}</ion-label>
      </ion-item>
      }
    </ion-list>

    <ion-datetime [(ngModel)]="waketime_start"></ion-datetime>
    {{waketime_start}}
    <ion-datetime [(ngModel)]="bedtime_start"></ion-datetime>
    {{bedtime_start}}

  <div id="container">
    <strong>Ready to create an app?</strong>
    <p>Start with Ionic <a target="_blank" rel="noopener noreferrer" href="https://ionicframework.com/docs/components">UI Components</a></p>
  </div>
</ion-content>
